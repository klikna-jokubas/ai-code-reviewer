name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  java:
    name: Java Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: ./mvnw test


  python:
    name: Python Analyzer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r analyzer/requirements.txt

      - name: Run tests
        working-directory: analyzer
        run: pytest


  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [ java, python ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::974442642911:role/GitHubActionsECRPush
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Java image
        run: |
          ./mvnw package -DskipTests
          docker build -t ai-code-reviewer-backend .

      - name: Build Python image
        run: |
          docker build -t ai-code-reviewer-analyzer ./analyzer

      - name: Tag and push images
        run: |
          docker tag ai-code-reviewer-backend:latest 974442642911.dkr.ecr.eu-north-1.amazonaws.com/ai-code-reviewer-backend:latest
          docker tag ai-code-reviewer-analyzer:latest 974442642911.dkr.ecr.eu-north-1.amazonaws.com/ai-code-reviewer-analyzer:latest

          docker push 974442642911.dkr.ecr.eu-north-1.amazonaws.com/ai-code-reviewer-backend:latest
          docker push 974442642911.dkr.ecr.eu-north-1.amazonaws.com/ai-code-reviewer-analyzer:latest