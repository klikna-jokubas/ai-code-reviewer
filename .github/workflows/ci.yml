name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  java:
    name: Java Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: ./mvnw test


  python:
    name: Python Analyzer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r analyzer/requirements.txt

      - name: Run tests
        working-directory: analyzer
        run: pytest


  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [ java, python ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Java image
        run: |
          ./mvnw package -DskipTests
          docker build -t ai-code-reviewer-backend .

      - name: Build Python image
        run: |
          docker build -t ai-code-reviewer-analyzer ./analyzer